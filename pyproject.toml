[project]
name = "daily-news-fetcher"
version = "0.1.0"
description = "Daily five-sector news digest built from public RSS feeds"
readme = "README.md"
# CI runs 3.12; anything from 3.10 up works.
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.0",
    "feedparser==6.0.11",
    "requests==2.32.3",
    "truststore==0.10.1",
]

[project.optional-dependencies]
# Only needed by scripts/diagnose_tls.py, so CI never installs it.
diagnose = ["cryptography>=42"]
