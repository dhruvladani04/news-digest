name: Daily news digest

on:
  schedule:
    # 00:20 UTC = 05:50 IST. GitHub's scheduler can run late under load,
    # so this is set 10 minutes early to land close to 06:00 IST.
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Look-back window in hours"
        required: false
        default: "24"

# required so the job can commit the generated data files back
permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build digest
        run: python scripts/fetch.py --hours "${{ github.event.inputs.hours || '24' }}"

      - name: Commit and push
        run: |
          git config user.name  "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "digest: $(date -u -d '+5 hours 30 minutes' +%Y-%m-%d)"
          # another run may have pushed while we were fetching
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report feed health
        if: always()
        run: |
          if [ -f data/latest.json ]; then
            python - <<'PY'
          import json
          m = json.load(open("data/latest.json"))["meta"]
          print(f"feeds ok: {m['feeds_ok']}/{m['feeds_total']}")
          print(f"stories published: {m['items_published']}")
          for f in m["failed_feeds"]:
              print(f"  FAILED  {f['feed']}: {f['error']}")
          PY
          fi
